<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mango Control Room - simulated demo</title><style>html,body{margin:0;background:#080f15;font-family:system-ui;color:#eef8fa}.demo-banner{font-size:11px;padding:10px 24px;border-bottom:1px solid #253440;background:#111d26;color:#bacbd7}.demo-banner b{color:#65dcc6;margin-right:10px}.demo-banner a{color:#65dcc6}</style></head><body>
<div class="demo-banner"><b>DEMO</b>Synthetic values for interface testing. No connection to a heat pump.</div>
<script type="module">
  const icons=await (await fetch('./icon-paths.json')).json();
  customElements.define('ha-icon',class extends HTMLElement {
    static get observedAttributes(){return ['icon'];}
    constructor(){super();this.attachShadow({mode:'open'});}
    connectedCallback(){this.draw();}attributeChangedCallback(){this.draw();}
    draw(){this.shadowRoot.innerHTML=`<style>:host{display:inline-flex;width:var(--mdc-icon-size,20px);height:var(--mdc-icon-size,20px)}svg{width:100%;height:100%;fill:currentColor}</style><svg viewBox="0 0 24 24"><path d="${icons[this.getAttribute('icon')]||''}"></path></svg>`;}
  });
  await import('../../custom_components/mango_tuya_local/frontend/mango-parameter-card.js');
  const data=await (await fetch('./demo-data.json')).json();
  const calls=[];
  const card=document.createElement('mango-control-panel');
  const hass={states:data.states,callWS:async()=>data.catalog,callService:async(domain,service,args)=>{
    calls.push({domain,service,args});
    if(window.demoFail)throw new Error('Simulated rejection; original value restored.');
    if(window.demoDelay)await new Promise(resolve=>setTimeout(resolve,window.demoDelay));
    if(domain==='number')hass.states[args.entity_id]={...hass.states[args.entity_id],state:String(args.value)};
    if(domain==='select')hass.states[args.entity_id]={...hass.states[args.entity_id],state:args.option};
    card.hass=hass;
  }};
  document.body.append(card);card.hass=hass;
  window.mangoDemo={card,hass,data,calls};
</script></body></html>
