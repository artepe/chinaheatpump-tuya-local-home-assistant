name: Tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests tools
      - run: pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check custom_components/mango_tuya_local/frontend/mango-parameter-card.js
      - run: npm test
